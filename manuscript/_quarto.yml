project:
  type: manuscript
  execute-dir: project
  post-render:
    # Re-bundle _manuscript/_tex/ into manuscript_tex.zip after every
    # render so the journal-submission zip never drifts from the PDF.
    - ../code/zip_tex.sh
    # Also re-split index.pdf into main_manuscript.pdf +
    # additional_file_1.pdf so the submission package stays in sync.
    - ../code/split_pdf.sh
manuscript:
  article: index.qmd
# notebooks:
#   - notebook: notebooks/equations.qmd

execute:
  freeze: auto
csl: _extensions/quarto-journals/agu/nature-medicine.csl
format:
  # html:
  #   toc: true
  #   comments:
  #     hypothesis: true
  docx:
    toc: false
    notebook-links: false
    execute:
        warning: false
  # agu-pdf:
  #   execute:
  #       message: false
  #       warning: false
  #   header-includes:
  #     - \usepackage{annotate-equations}
  pdf:
    documentclass: article
    linestretch: 1.5
    margin-left: 1in
    margin-right: 1in
    margin-top: 1in
    margin-bottom: 1in
    dpi: 100
    execute:
        warning: false
    header-includes:
      - \usepackage{annotate-equations}
      - \usepackage{lineno}
      - \linenumbers
    include-in-header:
      - fixes.tex
